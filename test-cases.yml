---
- summary: |
    Успешная авторизация пользователя
  requirement: |
    При корректном вводе логина и пароля пользователь должен авторизоваться и получить доступ к личному кабинету.
  prerequisites: |
    Открыта страница входа в приложение
    Пользователь с тестовыми данными существует в системе
  test-data: |
    Логин: testuser
    Пароль: Password123
  steps:
    - Ввести логин
    - Ввести пароль
    - Нажать "Войти"
  expected-result: |
    Выполнен редирект в личный кабинет (или отображено имя пользователя в шапке),
    в localStorage или cookie появился идентификатор сессии (sessionId или токен),
    для защищённых ресурсов возвращается 200 OK.

- summary: |
    Авторизация с несуществующими учетными данными
  requirement: |
    При неверном логине или пароле пользователь должен увидеть сообщение об ошибке и не быть авторизован.
  prerequisites: |
    Открыта страница входа
    Пользователя с такими данными в системе нет
  test-data: |
    Логин: no_user
    Пароль: badpass
  steps:
    - Ввести логин
    - Ввести пароль
    - Нажать "Войти"
  expected-result: |
    Отображается понятное сообщение об ошибке (например, "Неверный логин или пароль"),
    пользователь остаётся на странице входа, в localStorage/cookie отсутствует sessionId/токен.

- summary: |
    Регистрация нового пользователя с валидными данными
  requirement: |
    При корректных регистрационных данных должен создаваться новый пользователь и выполняться авторизация.
  prerequisites: |
    Открыта страница регистрации
    Логин/email ещё не зарегистрированы в системе
  test-data: |
    Имя: NewUser
    Логин: newuser123
    Email: newuser123@example.com
    Пароль: SecurePass1
  steps:
    - Заполнить поля регистрации валидными данными
    - Нажать "Зарегистрироваться"
  expected-result: |
    Регистрация проходит успешно, выполняется редирект в личный кабинет или показывается подтверждение регистрации,
    в localStorage/cookie появляется токен/sessionId, в списке пользователей появляется запись (при доступе к API).

- summary: |
    Регистрация с невалидными данными (валидация формы)
  requirement: |
    Формы регистрации должны валидировать поля и показывать сообщения об ошибках для некорректных данных.
  prerequisites: |
    Открыта страница регистрации
  test-data: |
    Логин: a
    Email: invalid-email
    Пароль: 123
  steps:
    - Ввести некорректные данные в поля регистрации
    - Нажать "Зарегистрироваться"
  expected-result: |
    Отображаются понятные сообщения валидации для каждого поля (например, "Некорректный email", "Пароль слишком короткий"),
    отправка формы не происходит, новый пользователь не создаётся.

- summary: |
    Загрузка главной страницы и корректность сетевых ресурсов
  requirement: |
    Все необходимые ресурсы страницы (HTML/CSS/JS/изображения и API-запросы) должны загружаться без ошибок.
  prerequisites: |
    Открыта главная страница приложения
  test-data: |
    Нет
  steps:
    - Открыть главную страницу
    - Открыть DevTools → Network и перезагрузить страницу
  expected-result: |
    Нет запросов с 4xx/5xx/Failed для основных ресурсов, статусы ответов для статических ресурсов 200/304, ключевые API-запросы возвращают ожидаемые коды (200/201).

- summary: |
    Отсутствие ошибок выполнения скриптов в консоли при загрузке страницы
  requirement: |
    На странице не должно быть uncaught ошибок JavaScript при загрузке и базовых взаимодействиях.
  prerequisites: |
    Открыта проверяемая страница (главная/каталог/страница товара)
  test-data: |
    Нет
  steps:
    - Открыть страницу
    - Открыть DevTools → Console и выполнить несколько переходов между страницами
  expected-result: |
    В консоли отсутствуют ошибки уровня Error/Uncaught Exception; предупреждения (Warning) при необходимости фиксируются отдельно.

- summary: |
    Просмотр каталога товаров
  requirement: |
    Каталог должен показывать список товаров с названием, ценой и ссылкой/кнопкой перехода на страницу товара.
  prerequisites: |
    Открыта страница каталога/главная с блоком товаров
  test-data: |
    Нет
  steps:
    - Открыть страницу каталога
    - Прокрутить список товаров до нескольких карточек
  expected-result: |
    Каждая карточка содержит название и цену товара, кнопка "Подробнее"/"Добавить в корзину" видна и кликабельна,
    при запросах к API для списка товаров возвращается 200 и корректная структура данных.

- summary: |
    Открытие страницы товара и отображение деталей
  requirement: |
    На странице товара должны отображаться название, изображение, цена и описание.
  prerequisites: |
    В каталоге присутствует как минимум один товар
  test-data: |
    Выбрать любую карточку товара в каталоге
  steps:
    - Нажать на товар или кнопку "Подробнее"
  expected-result: |
    Открывается страница товара с названием, ценой, описанием, изображением; отсутствуют визуальные артефакты и ошибки в консоли для этой страницы.

- summary: |
    Добавление товара в корзину
  requirement: |
    При добавлении товара корзина должна обновляться — товар появляется в корзине и счётчик/итог цены меняется.
  prerequisites: |
    Открыта страница товара или каталога
    Корзина пуста или известно начальное состояние
  test-data: |
    Выбрать товар X
  steps:
    - Нажать "Добавить в корзину" для товара X
    - Открыть страницу корзины
  expected-result: |
    Товар X появляется в списке корзины, счётчик в шапке увеличился, итоговая сумма рассчитывается корректно,
    соответствующий запрос к API вернул 200/201.

- summary: |
    Изменение количества товара в корзине
  requirement: |
    Изменение количества товара должно корректно пересчитывать итоговую сумму и сохраняться в корзине.
  prerequisites: |
    В корзине присутствует товар
  test-data: |
    Товар X, исходное количество = 1 → изменить на 3
  steps:
    - На странице корзины изменить количество товара X на 3
    - Нажать "Обновить" или дождаться автопересчёта
  expected-result: |
    Количество изменилось на 3, итоговая сумма пересчитана верно (цена * 3), в API/ответе корзины отражено новое количество.

- summary: |
    Удаление товара из корзины
  requirement: |
    Удаление товара должно удалять его из списка корзины и корректно обновлять итог.
  prerequisites: |
    В корзине присутствует как минимум один товар
  test-data: |
    Товар X в корзине
  steps:
    - Нажать кнопку "Удалить" рядом с товаром X
  expected-result: |
    Товар X исчезает из корзины, итоговая сумма обновляется, в API возвращается подтверждение удаления (например, 200/204).

- summary: |
    Оформление заказа (checkout) — успешный сценарий
  requirement: |
    Процесс оформления заказа должен завершаться подтверждением заказа и отображением номера/подтверждения.
  prerequisites: |
    В корзине есть товары, пользователь авторизован
  test-data: |
    Данные доставки/оплаты валидны (если применимо)
  steps:
    - Перейти в корзину
    - Нажать "Оформить заказ"
    - Заполнить необходимую информацию и подтвердить
  expected-result: |
    Появляется страница подтверждения/номер заказа, статус ответа от API успешный (201/200), корзина очищена или содержит обновлённое состояние.

- summary: |
    Выход пользователя (logout)
  requirement: |
    При выходе доступ к защищённым страницам должен быть запрещён, сессия удалена.
  prerequisites: |
    Пользователь авторизован
  test-data: |
    Нет
  steps:
    - Нажать "Выйти" / "Logout"
    - Попробовать перейти на защищённую страницу (личный кабинет)
  expected-result: |
    Пользователь перенаправляется на страницу входа/главную, в localStorage/cookie отсутствует sessionId/токен,
    доступ к защищённым страницам возвращает 401/перенаправление на вход.

- summary: |
    Респонсивность ключевых страниц на мобильных разрешениях
  requirement: |
    Ключевые страницы (главная, каталог, страница товара, корзина) должны отображаться корректно и быть функциональны на мобильных ширинах.
  prerequisites: |
    Открыт браузер с DevTools
  test-data: |
    Эмуляция устройства: ширина 375px (iPhone) и 768px (tablet)
  steps:
    - Включить эмуляцию устройств в DevTools
    - Проверить главную, каталог, страницу товара и корзину
  expected-result: |
    Элементы интерфейса не накладываются, кнопки доступны для нажатия, функционал (добавление в корзину, переходы) работает на мобильных разрешениях.

- summary: |
    Проверка корректной обработки ошибок API (коды ошибок)
  requirement: |
    При ошибках API приложение должно показывать информативное сообщение пользователю и не падать.
  prerequisites: |
    Возможность симулировать ошибочный ответ API (или тестовые данные)
  test-data: |
    Смоделировать ответ API с 500 или 404 для запроса списка товаров
  steps:
    - Смоделировать/вызвать ошибочный ответ сервера для ключевого запроса
    - Открыть соответствующую страницу в приложении
  expected-result: |
    В интерфейсе отображается понятное сообщение об ошибке ("Не удалось загрузить товары" и т.п.), приложение не выбрасывает необработанные ошибки в консоль, предоставлена возможность повторить запрос.

- summary: |
    Проверка загрузки изображений товаров
  requirement: |
    Изображения товаров должны корректно загружаться и заменяться плейсхолдером при ошибке загрузки.
  prerequisites: |
    На странице каталога и странице товара есть изображения
  test-data: |
    Один из ресурсов изображения возвращает 404
  steps:
    - Открыть страницу каталога/товара
    - Проверить загрузку изображений; при ошибке симулировать 404 для одного из изображений
  expected-result: |
    Для корректных изображений показываются сами изображения,
    для не загружающихся изображений отображается плейсхолдер или альтернативный текст, приложение не падает.

- summary: |
    Проверка ссылок навигации (header/footer)
  requirement: |
    Навигационные ссылки должны вести на соответствующие страницы без ошибок.
  prerequisites: |
    Открыта главная страница
  test-data: |
    Нет
  steps:
    - На главной странице кликнуть по всем ссылкам в шапке и футере (Каталог, Корзина, Вход и т.д.)
  expected-result: |
    Каждый клик приводит на ожидаемую страницу, в Network нет ошибок 4xx/5xx при загрузке, URL корректный и контент соответствует странице.
